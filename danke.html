<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danke – Ihr Termin steht</title>
<style>
  :root {
    --dunkelblau: #0b2545;
    --dunkelblau-hell: #13355e;
    --weiss: #ffffff;
    --grau: #5c6b7a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--weiss);
    color: var(--dunkelblau);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .container {
    max-width: 620px;
    width: 100%;
    padding: 48px 32px;
    text-align: center;
  }

  h1 {
    font-size: 2.2rem;
    line-height: 1.3;
    margin: 0 0 16px 0;
    color: var(--dunkelblau);
    font-weight: 700;
  }

  .subtext {
    font-size: 1.05rem;
    color: var(--grau);
    margin: 0 0 48px 0;
  }

  .steps-box {
    background-color: #f4f7fb;
    border: 1px solid #dde5ee;
    border-radius: 12px;
    padding: 32px 28px;
    text-align: left;
  }

  .steps-box h2 {
    font-size: 1.2rem;
    color: var(--dunkelblau);
    margin: 0 0 20px 0;
    text-align: center;
  }

  ol.steps {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ol.steps li {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 16px;
    font-size: 1rem;
    color: var(--dunkelblau-hell);
    line-height: 1.5;
  }

  ol.steps li:last-child {
    margin-bottom: 0;
  }

  .step-number {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background-color: var(--dunkelblau);
    color: var(--weiss);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .back-link {
    display: inline-block;
    margin-top: 44px;
    color: var(--dunkelblau);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    border-bottom: 2px solid var(--dunkelblau);
    padding-bottom: 2px;
  }

  .back-link:hover {
    color: var(--dunkelblau-hell);
    border-bottom-color: var(--dunkelblau-hell);
  }

  .footer {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid #e2e8f0;
    font-size: 0.85rem;
    color: var(--grau);
  }

  @media (max-width: 480px) {
    h1 {
      font-size: 1.7rem;
    }
    .container {
      padding: 32px 20px;
    }
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Danke! Ihr Termin steht.</h1>
    <p class="subtext">Sie bekommen die Einladung gleich per E-Mail.</p>

    <div class="steps-box">
      <h2>So geht es weiter</h2>
      <ol class="steps">
        <li>
          <span class="step-number">1</span>
          <span>Wir schauen uns Ihre Firma vorher an.</span>
        </li>
        <li>
          <span class="step-number">2</span>
          <span>Im Termin sprechen wir 30 Minuten über Ihre IT.</span>
        </li>
        <li>
          <span class="step-number">3</span>
          <span>Danach bekommen Sie Ihren Bericht.</span>
        </li>
      </ol>
    </div>

    <a href="/" class="back-link">Zurück zur Startseite</a>

    <div class="footer">
      &copy; B2CyberSec GmbH
    </div>
  </div>

</body>
</html>
